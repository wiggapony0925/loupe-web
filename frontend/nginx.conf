# trackify web — SPA host on Cloud Run (port 8080, which Cloud Run requires).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed assets are immutable; index.html must never be cached or a deploy
  # leaves browsers pinned to chunks that no longer exist.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Client-side routing: every unknown path renders the app.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The API is a separate Cloud Run service reached over CORS (its allowlist
  # carries this origin), so no /v1 proxy is needed here.
}
