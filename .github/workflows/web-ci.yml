name: web CI

# Gates every PR (and pushes to main) on the loupe-web checks. The Expo app
# (loupe-frontend) isn't a workspace member, so `npm ci` only installs
# packages/* + loupe-web — this stays fast.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: loupe-web — typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # moderato is a PRIVATE repo and this one is PUBLIC, which is exactly why
      # `moderato/` is gitignored here (see .gitignore, and the `chore: untrack
      # moderato/` commit). Committing it back would publish private source, so
      # the only safe way to give CI the workspace it needs is to fetch it at
      # build time with a token that is never written into the tree.
      #
      # MODERATO_TOKEN is a PAT with `repo` scope on wiggapony0925/moderato.
      # Without it, everything that needs the workspace to resolve is skipped
      # and said out loud — see the guard on the steps below. GITHUB_TOKEN
      # cannot be used: it is scoped to this repository only.
      - name: Fetch the moderato workspace
        id: moderato
        env:
          MODERATO_TOKEN: ${{ secrets.MODERATO_TOKEN }}
        run: |
          if [ -z "${MODERATO_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=moderato unavailable::MODERATO_TOKEN is not set, so the private moderato workspace could not be fetched. Typecheck, lint, unit tests and build are SKIPPED — this job is not verifying loupe-web. Add a PAT with repo scope on wiggapony0925/moderato as the MODERATO_TOKEN secret to turn them back on."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${MODERATO_TOKEN}@github.com/wiggapony0925/moderato.git" \
            moderato
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      # The consumer half of consumer-driven contracts. Asserts that
      # contracts/loupe-web.contract.json still describes this app — every
      # endpoint reached through packages/core must be declared, or the
      # backend's can-i-deploy gate is guarding a surface that has moved on.
      #
      # Root-level, not `-w loupe-web`: the HTTP layer is the shared
      # packages/core package, so the contract covers both.
      #
      # DELIBERATELY BEFORE TYPECHECK. Typecheck currently fails on every run —
      # `moderato/` is listed in this repo's npm workspaces but is gitignored
      # (0 tracked files) and lives in its own private repo, so CI checks out a
      # tree where `moderato/react` cannot resolve. Every step after it is
      # skipped, which is how this job has been red since 2026-08-11 while
      # protecting nothing. This check needs no workspace to resolve, so running
      # it first means the contract is guarded today rather than whenever the
      # moderato packaging is sorted out.
      - name: Contract still describes this app
        run: npm run contract:ci

      - name: Typecheck
        if: steps.moderato.outputs.available == 'true'
        run: npm run typecheck -w loupe-web

      - name: Lint
        if: steps.moderato.outputs.available == 'true'
        run: npm run lint -w loupe-web

      - name: Unit tests
        if: steps.moderato.outputs.available == 'true'
        run: npm test -w loupe-web

      - name: Build
        if: steps.moderato.outputs.available == 'true'
        run: npm run build -w loupe-web

      - name: Install Playwright Chromium
        if: steps.moderato.outputs.available == 'true'
        working-directory: loupe-web
        run: npx playwright install --with-deps chromium

      - name: Storybook story tests
        if: steps.moderato.outputs.available == 'true'
        run: npm run test:stories -w loupe-web
